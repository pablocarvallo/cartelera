  if (!e.name) return [[e, null]];
  if (!e.weak) return [[e, await nfFindOne(e, !e.explicit)]]; // Prime Video ya dice si es película
  for (const q of [e.name, ...(e.alts || [])]) {
    const hit = nfBest(await nfSearchList('/search/tv', q), q, 60);
    if (hit) return [[e, hit]];
  }
  const out = [], left = [];
  for (const m of e.members || []) {
    const me = { name: m.name, kind: 'movie', first: m.first, last: m.last, plays: m.plays, eps: 0 };
    const hit = await nfFindOne(me, false);
    if (hit) out.push([me, hit]); else left.push(m);
  }
  if (left.length) {
    const firsts = left.map(m => m.first).filter(Boolean).sort(), lasts = left.map(m => m.last).filter(Boolean).sort();
    out.push([{ name: e.name, kind: 'tv', first: firsts[0] || '', last: lasts[lasts.length - 1] || '', plays: left.reduce((a, m) => a + m.plays, 0), eps: left.length }, null]);
  }
  return out;
}
function nfApply(e, r, run) {
  const nf = nfState(), st = nf.stats || (nf.stats = { total: 0, added: 0, merged: 0, unmatched: 0, run });
  if (!r) {
    nf.pending.push({ name: e.name, kind: e.kind, first: e.first, last: e.last, plays: e.plays, eps: e.eps, src: e.src || 'Netflix', explicit: !!e.explicit });
    st.unmatched++; return;
  }
  const k = keyOf(r);
  const eps = r.type !== 'tv' || e.explicit ? 0 : Math.max(1, e.kind === 'tv' ? e.eps : 1); // Prime Video no dice cuántos episodios
  const it = state.items[k];
  if (it) {
    const n = it.nf;
    if (n && n.run === run) { // otro nombre de Netflix para el mismo título, en esta misma importación
      n.eps += eps; n.plays += e.plays; n.src = nfSrcJoin(n.src, e.src);
    } else {
      it.nf = { eps: Math.max(eps, n ? n.eps : 0), plays: Math.max(e.plays, n ? n.plays : 0), first: nfMin(n && n.first, e.first), run, src: nfSrcJoin(n && (n.src || 'Netflix'), e.src || 'Netflix') };
      if (!(it.src === 'netflix' && it.nfRun === run)) st.merged++;
    }
    it.nf.first = nfMin(it.nf.first, e.first);
    if (it.status === 'seen' && e.last && (!it.seenAt || e.last > it.seenAt)) it.seenAt = nfDay(e.last);
    return;
  }
  state.items[k] = {
    id: r.id, type: r.type, title: r.title, year: r.year, poster: r.poster, status: 'seen',
    seenAt: nfDay(e.last), addedAt: nfDateMs(e.last), prov: null, provAt: 0,
    nf: { eps, plays: e.plays, first: e.first, run, src: e.src || 'Netflix' }, src: 'netflix', nfRun: run,
  };
  st.added++;
}
async function nfRun() {
  const nf = state.nf;
  if (nfBusy || PREVIEW || !state.key || !nf || !nf.queue.length) return;
  nfBusy = true; nf.error = ''; nfPaint();
  const run = nf.stats ? nf.stats.run : Date.now();
  let lastPaint = Date.now();
  while (nf.queue.length) {
    const batch = nf.queue.slice(0, 4);
    const out = await Promise.all(batch.map(e => nfResolve(e).then(list => ({ e, list }), err => ({ e, err }))));
    let stop = false, slow = false;
    for (const { e, list, err } of out) {
      if (err && (err.code === 'auth' || err.code === 'net' || err.code === 'nokey')) { nf.error = err.message; stop = true; continue; }
      if (err && err.code === 'rate') { slow = true; continue; } // TMDB pide ir más lento: queda en la cola
      const i = nf.queue.indexOf(e); if (i >= 0) nf.queue.splice(i, 1);
      if (err) nfApply(e, null, run);
      else for (const [x, r] of list) nfApply(x, r, run);
    }
    save();
    if (stop) break;
    if (Date.now() - lastPaint > 800) {
      lastPaint = Date.now(); nfPaint();
      if (state.tab === 'seen') renderSeen();
    }
    await sleep(slow ? 2500 : 120);
  }
  const finished = !nf.queue.length;
  if (finished && nf.stats) nf.stats.finishedAt = Date.now();
  nfBusy = false; save(); nfPaint(); renderView();
  if (finished && nf.stats) toast(`Listo: ${nfPlural(nf.stats.added, 'título nuevo', 'títulos nuevos')} en Vistos`);
}

/* Títulos que no se pudieron identificar */
function nfPendingOpen() { current = null; sheetMode = 'nfpending'; openSheet(nfPendingHTML(), 'Sin identificar'); }
function nfPendingHTML() {
  const p = nfState().pending;
  let h = `<h2 class="s-title">Sin identificar</h2>`;
  if (!p.length) return h + emptyHTML(IC.checkCircle, 'No queda nada pendiente', 'Todos los títulos de tu historial ya están en tus listas.');
  h += `<p class="how">No encontré estos títulos en TMDB con el nombre que usa la plataforma. Toca la lupa para elegir el correcto o descártalos.</p>`;
  h += `<div class="list">${p.map((e, i) => `<div class="item"><div class="item-main static">${posterHTML({ title: nfLabel(e) }, 'sm')}<div class="info"><div class="title">${esc(nfLabel(e))}</div><div class="sub"><span>${esc(nfLine(e))}</span></div></div></div>
    <button class="item-act" type="button" data-nffind="${i}" aria-label="Buscar ${esc(nfLabel(e))}">${SVG(IC.search)}</button>
    <button class="item-act gray" type="button" data-nfdrop="${i}" aria-label="Descartar ${esc(nfLabel(e))}">${SVG('<path d="M6 6l12 12M18 6 6 18"/>')}</button></div>`).join('')}</div>`;
  h += `<button class="btn ${nfDropAll ? 'danger' : 'gray'} block" type="button" data-act="nfdropall">${SVG(IC.trash)}${nfDropAll ? 'Toca de nuevo para descartar todos' : 'Descartar todos'}</button>`;
  return h;
}
let nfDropAll = false;
function nfFind(i) {
  const e = nfState().pending[i]; if (!e) return;
  closeSheet();
  search.pending = e;
  setTab('search');
  $('#q').value = e.name;
  search.q = e.name; search.results = null; search.error = null;
  if (e.name) runSearch(e.name); else { renderSearch(); $('#q').focus(); } // sin nombre: lo escribe quien recuerde la serie
}
function nfPick(k) {
  const e = search.pending; if (!e) return;
  const b = baseOf(k); if (!b) return;
  const nf = nfState();
  const i = nf.pending.indexOf(e); if (i >= 0) nf.pending.splice(i, 1);
  nfApply(e, b, 'manual-' + Date.now());
  const it = state.items[k];
  if (it && it.status !== 'seen') { it.status = 'seen'; it.seenAt = e.last || today(); }
  search.pending = null;
  save();
  toast(`${b.title} quedó en Vistos`);
  $('#q').value = ''; search.q = ''; search.results = null;
  if (nf.pending.length) { renderSearch(); nfPendingOpen(); }
  else setTab('seen');
}
